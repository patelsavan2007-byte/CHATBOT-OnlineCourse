[pytest]
testpaths = tests
norecursedirs = .venv venv node_modules vector_db knowledge_base
addopts = -s -m "not live" --ignore=tests/test_http_interleaved.py --ignore=tests/test_live_interleaved_rag.py
markers =
    live: requires a running service, vector store, database, or LLM provider
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestDeprecationWarning
    ignore::pytest.PytestRemovedIn10Warning
