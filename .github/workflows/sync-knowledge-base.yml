name: Sync Knowledge Base (Daily)

# Runs every day at 02:00 UTC (07:30 IST) and can be triggered manually
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force rebuild vector DB even if no KB files changed"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  sync-and-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: deploy
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync website and rebuild vector DB
        working-directory: backend
        env:
          MIN_DIFF_RATIO: "0.05"
        run: |
          python -X utf8 -I scripts/sync_website.py

      - name: Force rebuild vector DB (manual trigger only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.force_rebuild == 'true'
        working-directory: backend
        run: |
          python -X utf8 -I rebuild_vectordb.py

      - name: Commit updated KB and vector DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/knowledge_base/ backend/vector_db/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-sync KB from charusat.online [skip ci]

Automated daily scrape and vector DB rebuild.

Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>"
            git push origin deploy
            echo "Changes pushed to deploy branch."
          fi
