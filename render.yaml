# Render Infrastructure-as-Code - CHARUSAT Online Course Chatbot Backend
# https://docs.render.com/blueprint-spec
#
# Free Plan Operational Caveats:
# 1. Inactivity Spin-Down: Free web services spin down after 15 minutes of idle
#    traffic. The first inbound request experiences a cold start of 30 to 50 seconds
#    while container boots and models load.
# 2. Memory Cap: Free instances have a strict 512 MB RAM limit. Chroma vector
#    database is loaded with lightweight ONNX embeddings (bge-small-en-v1.5) to
#    fit comfortably within bounds.
# 3. Ephemeral Disk: Local disk changes do not persist across restarts or redeploys.
#    Vector database is tracked in git and loaded at startup; conversations, feedback,
#    and audit trails are persisted remotely in MongoDB Atlas.

services:
  - type: web
    name: charusat-chatbot-api
    runtime: python
    region: oregon
    branch: deploy
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY_SUGGEST
        sync: false
      - key: GROQ_API_KEY_SUGGEST
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
    plan: free
