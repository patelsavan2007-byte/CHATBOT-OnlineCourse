# Render Infrastructure-as-Code — CHARUSAT Online Course Chatbot Backend
# https://docs.render.com/blueprint-spec
#
# This file tells Render how to deploy the FastAPI backend automatically
# from the `deploy` branch.  The vector database is rebuilt during each
# deploy from the knowledge_base files that are tracked in git.

services:
  - type: web
    name: charusat-chatbot-api
    runtime: python
    region: oregon
    branch: deploy
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_API_KEY
        sync: false          # You set this manually in the Render dashboard
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
    plan: free
